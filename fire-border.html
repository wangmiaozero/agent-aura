<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Fire Border</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: radial-gradient(circle at 50% 40%, #24100b 0%, #0b0808 40%, #030303 100%);
				font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.site-nav {
				position: fixed;
				top: 18px;
				left: 18px;
				z-index: 20;
				display: flex;
				gap: 8px;
			}

			.site-nav a {
				color: #ffc292;
				text-decoration: none;
				font-size: 12px;
				padding: 6px 10px;
				border-radius: 999px;
				border: 1px solid rgba(255, 125, 35, 0.35);
				background: rgba(0, 0, 0, 0.35);
			}

			.fire-card {
				position: relative;
				z-index: 2;
				width: min(720px, calc(100vw - 100px));
				min-height: 380px;
				padding: 48px;
				border-radius: 22px;
				background: linear-gradient(145deg, rgba(30, 20, 17, 0.94), rgba(8, 8, 9, 0.96));
				border: 1px solid rgba(255, 120, 25, 0.85);
				box-shadow:
					0 0 5px rgba(255, 150, 40, 0.8),
					0 0 14px rgba(255, 80, 0, 0.55),
					0 0 30px rgba(255, 45, 0, 0.25),
					inset 0 0 20px rgba(255, 80, 20, 0.08);
				color: white;
				overflow: hidden;
			}

			.fire-card::before {
				content: '';
				position: absolute;
				inset: 0;
				pointer-events: none;
				background: radial-gradient(circle at 50% 0%, rgba(255, 120, 20, 0.14), transparent 45%);
				opacity: 0.8;
			}

			.fire-card::after {
				content: '';
				position: absolute;
				inset: 5px;
				border-radius: 17px;
				border: 1px solid rgba(255, 175, 80, 0.12);
				pointer-events: none;
			}

			.content {
				position: relative;
				z-index: 1;
			}

			.tag {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				padding: 7px 13px;
				border-radius: 999px;
				border: 1px solid rgba(255, 120, 30, 0.28);
				background: rgba(255, 80, 0, 0.08);
				color: #ff9a50;
				font-size: 12px;
				letter-spacing: 1.8px;
				text-transform: uppercase;
			}

			.fire-icon {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: #ff7b22;
				box-shadow:
					0 0 5px #ff7b22,
					0 0 12px #ff3700;
			}

			h1 {
				margin: 26px 0 12px;
				font-size: clamp(36px, 6vw, 64px);
				line-height: 1;
				letter-spacing: -2px;
				background: linear-gradient(180deg, #ffffff 5%, #ffd2ac 45%, #ff702b 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			.description {
				max-width: 520px;
				margin: 0;
				color: rgba(255, 255, 255, 0.52);
				line-height: 1.8;
				font-size: 15px;
			}

			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				margin-top: 32px;
				height: 42px;
				padding: 0 22px;
				border: 1px solid rgba(255, 125, 35, 0.6);
				border-radius: 10px;
				background: linear-gradient(180deg, rgba(255, 115, 30, 0.22), rgba(170, 35, 0, 0.12));
				color: #ffc292;
				cursor: pointer;
			}

			.corner {
				position: absolute;
				width: 18px;
				height: 18px;
				border-color: rgba(255, 190, 100, 0.8);
			}

			.corner-tl {
				top: 10px;
				left: 10px;
				border-left: 2px solid;
				border-top: 2px solid;
			}

			.corner-tr {
				top: 10px;
				right: 10px;
				border-right: 2px solid;
				border-top: 2px solid;
			}

			.corner-bl {
				bottom: 10px;
				left: 10px;
				border-left: 2px solid;
				border-bottom: 2px solid;
			}

			.corner-br {
				bottom: 10px;
				right: 10px;
				border-right: 2px solid;
				border-bottom: 2px solid;
			}
		</style>
	</head>
	<body>
		<nav class="site-nav">
			<a href="./index.html">Agent Aura</a>
			<a href="./glow.html">Glow</a>
			<a href="./motion-border.html">Neural</a>
			<a href="./burning-fire.html">Burning</a>
		</nav>

		<div class="fire-card" id="fire-card">
			<span class="corner corner-tl"></span>
			<span class="corner corner-tr"></span>
			<span class="corner corner-bl"></span>
			<span class="corner corner-br"></span>
			<div class="content">
				<div class="tag">
					<span class="fire-icon"></span>
					AGENT AURA FIRE SYSTEM
				</div>
				<h1>BURNING<br />BORDER</h1>
				<p class="description">
					火焰沿着 UI 边框持续燃烧，包含火焰核心、橙红色外焰、火星飞溅和动态扰流。现已作为
					<code>FireBorder</code> 从 agent-aura 直接调用。
				</p>
				<div class="button">Ignite System</div>
			</div>
		</div>

		<script type="module">
			import { aura } from './build/index.js'

			aura.fire('#fire-card')
		</script>
	</body>
</html>
