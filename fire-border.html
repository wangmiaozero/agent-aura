<!doctype html>
<html lang="en" data-i18n-page="home">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Fire Border</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 40%, #24100b 0%, #0b0808 40%, #030303 100%);
			}
			.figure {
				border-color: rgba(255, 120, 30, 0.4);
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<button type="button" data-lang-toggle>中文</button>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.fireTag">Fire Border</div>
				<h1 data-i18n="home.fireTitle">BURNING BORDER</h1>
				<p data-i18n="home.fireDesc">
					火焰沿 UI 边框持续燃烧，带核心、外焰和火星飞溅。适合危险模式、执行中、点火态。
				</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage" id="fire-card-stage">
					<div class="figure is-card" id="fire-card">
						<span class="figure-label" data-i18n="demo.executing">执行中</span>
					</div>
				</div>
				<div class="figure-stage" id="fire-pill-stage">
					<div class="figure is-pill" id="fire-pill">
						<span class="figure-label" data-i18n="demo.danger">危险</span>
					</div>
				</div>
				<div class="figure-stage" id="fire-circle-stage">
					<div class="figure is-circle" id="fire-circle">
						<span class="figure-label" data-i18n="demo.avatar">头像</span>
					</div>
				</div>
				<div class="figure-stage" id="fire-chip-stage">
					<div class="figure is-pill" id="fire-chip">
						<span class="figure-label" data-i18n="demo.chip">标签</span>
					</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.fire">Fire · 给 AI：安装并挂到指定区域</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="fire" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="fire">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="fire" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				aura.fire('#fire-card', { container: '#fire-card-stage' })
				aura.fire('#fire-pill', { container: '#fire-pill-stage', particleCount: 700, skipGreeting: true })
				aura.fire('#fire-circle', { container: '#fire-circle-stage', particleCount: 800, skipGreeting: true })
				aura.fire('#fire-chip', { container: '#fire-chip-stage', particleCount: 520, skipGreeting: true })
			})
		</script>
	</body>
</html>
