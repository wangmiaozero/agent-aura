<!doctype html>
<html lang="en" data-i18n-page="home" data-i18n-title="page.demonic.title">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Demonic</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 42%, #1c0d20 0%, #0d0710 35%, #050407 72%, #010102 100%);
			}
			.figure {
				background: radial-gradient(circle at 50% 35%, #38183f, #170c1c 60%, #070509 100%);
				color: #e8baff;
				border-color: rgba(215, 110, 255, 0.12);
				font-family: 'Songti SC', 'STSong', serif;
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<select data-lang-select aria-label="Language">
					<option value="en">EN</option>
					<option value="zh">中文</option>
					<option value="ja">日本語</option>
					<option value="ko">한국어</option>
				</select>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.demonicTag">Forbidden · Dark Mist</div>
				<h1 data-i18n="home.demonicTitle">DEMONIC AURA</h1>
				<p data-i18n="home.demonicDesc">
					WebGL2 紫黑魔光 + 魔雾场 + 魔焰粒子，自动跟随 border-radius / clip-path。
				</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage" id="mo-circle-stage">
					<div class="figure is-circle" id="mo-circle" data-i18n="demo.glyph.demon">魔</div>
				</div>
				<div class="figure-stage" id="mo-hex-stage">
					<div class="figure is-hex" id="mo-hex" data-i18n="demo.glyph.ban">禁</div>
				</div>
				<div class="figure-stage" id="mo-pill-stage">
					<div class="figure is-pill" id="mo-pill">
						<span class="figure-label" data-i18n="demo.overclock">超频</span>
					</div>
				</div>
				<div class="figure-stage" id="mo-diamond-stage">
					<div class="figure is-diamond" id="mo-diamond" data-i18n="demo.glyph.ember">焰</div>
				</div>
				<div class="figure-stage" id="mo-card-stage">
					<div class="figure is-card" id="mo-card">
						<span class="figure-label" data-i18n="demo.danger">危险</span>
					</div>
				</div>
				<div class="figure-stage" id="mo-shield-stage">
					<div class="figure is-shield" id="mo-shield" data-i18n="demo.glyph.hex">邪</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.demonic">Demonic · 给 AI：安装并挂到指定元素</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="demonic" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="demonic">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="demonic" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				const light = { fieldCount: 90, detailCount: 50, skipGreeting: true }
				aura.demonic('#mo-circle', { container: '#mo-circle-stage', offset: 7, fieldCount: 160, detailCount: 90 })
				aura.demonic('#mo-hex', { container: '#mo-hex-stage', offset: 6, ...light })
				aura.demonic('#mo-pill', { container: '#mo-pill-stage', offset: 6, ...light })
				aura.demonic('#mo-diamond', { container: '#mo-diamond-stage', offset: 6, ...light })
				aura.demonic('#mo-card', { container: '#mo-card-stage', offset: 5, ...light })
				aura.demonic('#mo-shield', { container: '#mo-shield-stage', offset: 6, ...light })
			})
		</script>
	</body>
</html>
