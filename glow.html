<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Glow</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>"
		/>
		<meta
			name="description"
			content="WebGL2 animated border with stream glow effects. Zero dependencies, modern browsers only."
		/>
		<style>
			:root {
				--primary: rgb(57, 182, 255);
				--secondary: rgb(189, 69, 251);
				--accent-1: rgb(255, 87, 51);
				--accent-2: rgb(255, 214, 0);
				--bg: #ffffff;
				--text: #1a1a1a;
				--text-muted: #666666;
				--overlay-bg: rgba(255, 255, 255, 0.85);
				--border: rgba(0, 0, 0, 0.1);
				--code-bg: rgba(0, 0, 0, 0.05);
			}

			[data-theme='dark'] {
				--bg: #111;
				--text: #ffffff;
				--text-muted: #a0a0a0;
				--overlay-bg: rgba(0, 0, 0, 0.9);
				--border: rgba(255, 255, 255, 0.2);
				--code-bg: rgba(255, 255, 255, 0.08);
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: var(--bg);
				color: var(--text);
				overflow: hidden;
				width: 100vw;
				height: 100vh;
				position: relative;
			}

			.site-nav {
				position: fixed;
				top: 1.25rem;
				left: 1.25rem;
				z-index: 30;
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			.site-nav a {
				text-decoration: none;
				color: var(--text);
				font-size: 12px;
				padding: 6px 10px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: var(--overlay-bg);
			}

			.container {
				position: relative;
				z-index: 10;
				width: 100vw;
				height: 100vh;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 2rem;
			}

			.content {
				background: var(--overlay-bg);
				backdrop-filter: blur(20px);
				border-radius: 24px;
				border: 1px solid var(--border);
				padding: 3rem 2rem;
				max-width: 600px;
				width: 100%;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
			}

			[data-theme='dark'] .content {
				box-shadow:
					0 20px 40px rgba(0, 0, 0, 0.5),
					0 0 0 1px rgba(255, 255, 255, 0.1),
					inset 0 1px 0 rgba(255, 255, 255, 0.1);
			}

			.title {
				font-size: clamp(2.5rem, 8vw, 4rem);
				font-weight: 700;
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				margin-bottom: 1rem;
				letter-spacing: -0.02em;
			}

			.tagline {
				font-size: clamp(1rem, 3vw, 1.25rem);
				color: var(--text-muted);
				margin-bottom: 2rem;
				line-height: 1.5;
				font-style: italic;
				font-weight: 300;
			}

			.glamorous {
				font-weight: 600;
				font-size: 1.1em;
				animation: colorCycle 4s ease-in-out infinite;
			}

			@keyframes colorCycle {
				0% {
					color: rgb(57, 182, 255);
				}
				25% {
					color: rgb(189, 69, 251);
				}
				50% {
					color: rgb(255, 87, 51);
				}
				75% {
					color: rgb(255, 214, 0);
				}
				100% {
					color: rgb(57, 182, 255);
				}
			}

			.features {
				display: flex;
				justify-content: center;
				gap: 2rem;
				margin-bottom: 2rem;
				flex-wrap: wrap;
			}

			.feature {
				font-size: 0.9rem;
				color: var(--text-muted);
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}

			.feature::before {
				content: '✨';
			}

			.actions {
				display: flex;
				justify-content: center;
				gap: 1rem;
				margin-bottom: 2rem;
				flex-wrap: wrap;
			}

			.btn {
				padding: 0.75rem 1.5rem;
				border-radius: 12px;
				text-decoration: none;
				font-weight: 600;
				font-size: 0.9rem;
				transition: all 0.2s ease;
				border: none;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
			}

			.btn-primary {
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				color: white;
			}

			.btn-secondary {
				background: var(--code-bg);
				color: var(--text);
				border: 1px solid var(--border);
			}

			.install {
				background: var(--code-bg);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 1rem;
				font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
				font-size: 0.85rem;
				margin-bottom: 1rem;
			}

			.credit {
				font-size: 0.8rem;
				color: var(--text-muted);
				opacity: 0.7;
			}

			.credit a {
				color: var(--primary);
				text-decoration: none;
			}

			.theme-toggle {
				position: fixed;
				top: 2rem;
				right: 2rem;
				z-index: 20;
				background: var(--overlay-bg);
				backdrop-filter: blur(20px);
				border: 1px solid var(--border);
				border-radius: 50px;
				padding: 0.5rem;
				cursor: pointer;
			}

			.toggle-inner {
				width: 50px;
				height: 24px;
				background: var(--code-bg);
				border-radius: 12px;
				position: relative;
			}

			.toggle-circle {
				width: 20px;
				height: 20px;
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				border-radius: 50%;
				position: absolute;
				top: 2px;
				left: 2px;
				transition: all 0.3s ease;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 10px;
			}

			[data-theme='dark'] .toggle-circle {
				transform: translateX(26px);
			}
		</style>
	</head>
	<body>
		<nav class="site-nav">
			<a href="./index.html">Agent Aura</a>
			<a href="./motion-border.html">Neural</a>
			<a href="./fire-border.html">Fire Border</a>
			<a href="./burning-fire.html">Burning</a>
		</nav>

		<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
			<div class="toggle-inner">
				<div class="toggle-circle">🌙</div>
			</div>
		</button>

		<div class="container">
			<div class="content">
				<h1 class="title">Agent Aura</h1>
				<p class="tagline">
					<span class="glamorous">Glamorous</span> WebGL2 animated mask with stream glow effects.
					✨Make your Agent pretty.
				</p>

				<div class="features">
					<div class="feature">Zero dependencies</div>
					<div class="feature">Modern browsers</div>
					<div class="feature">WebGL2 powered</div>
				</div>

				<div class="actions">
					<a
						href="https://github.com/wangmiaozero/agent-aura"
						class="btn btn-primary"
						target="_blank"
					>
						Source Code
					</a>
					<a
						href="https://www.npmjs.com/package/agent-aura"
						class="btn btn-secondary"
						target="_blank"
					>
						NPM Package
					</a>
				</div>

				<div class="install">npm install agent-aura</div>

				<div class="credit">
					Made with ❤️ by
					<a href="https://github.com/wangmiaozero" target="_blank">wangmiao</a>
				</div>
			</div>
		</div>

		<script type="module">
			import { Glow } from './build/index.js'

			const themeToggle = document.getElementById('themeToggle')
			const toggleCircle = themeToggle.querySelector('.toggle-circle')
			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)')

			function initTheme() {
				const savedTheme = localStorage.getItem('theme')
				const systemTheme = prefersDark.matches ? 'dark' : 'light'
				setTheme(savedTheme || systemTheme)
			}

			function setTheme(theme) {
				document.documentElement.setAttribute('data-theme', theme)
				localStorage.setItem('theme', theme)
				toggleCircle.textContent = theme === 'dark' ? '☀️' : '🌙'
				if (window.glowFx) {
					window.glowFx.dispose()
					createGlow(theme)
				}
			}

			themeToggle.addEventListener('click', () => {
				const current = document.documentElement.getAttribute('data-theme')
				setTheme(current === 'dark' ? 'light' : 'dark')
			})

			function createGlow(mode = 'light') {
				const glow = new Glow({
					width: document.documentElement.clientWidth,
					height: document.documentElement.clientHeight,
					mode,
					styles: {
						position: 'fixed',
						inset: '0',
						zIndex: '1',
					},
				})
				document.body.appendChild(glow.element)
				window.addEventListener('resize', () =>
					glow.resize(document.documentElement.clientWidth, document.documentElement.clientHeight)
				)
				glow.start()
				glow.fadeIn()
				window.glowFx = glow
			}

			initTheme()
			createGlow(document.documentElement.getAttribute('data-theme'))
		</script>
	</body>
</html>
