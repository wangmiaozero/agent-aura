<!doctype html>
<html lang="en" data-i18n-page="home">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Glow</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 42%, #1a2030 0%, #0b0d12 48%, #050506 100%);
			}
			#glow-light-stage {
				background: radial-gradient(circle at 50% 40%, #f3ebe3 0%, #d9cfc4 55%, #cbbfb2 100%);
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<button type="button" data-lang-toggle>中文</button>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.glowTag">Stream · Mask</div>
				<h1 data-i18n="home.glowTitle">GLOW</h1>
				<p data-i18n="home.glowDesc">WebGL2 彩色流光边框，适合 Agent 工作台、对话框、卡片高亮。</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage">
					<div class="figure is-card" id="glow-card">
						<span class="figure-label" data-i18n="demo.highlight">高亮</span>
					</div>
				</div>
				<div class="figure-stage" id="glow-light-stage">
					<div class="figure is-card is-light" id="glow-light">
						<span class="figure-label" data-i18n="demo.light">浅色底</span>
					</div>
				</div>
				<div class="figure-stage">
					<div class="figure is-pill" id="glow-pill">
						<span class="figure-label" data-i18n="demo.streaming">流式输出</span>
					</div>
				</div>
				<div class="figure-stage">
					<div class="figure is-circle" id="glow-avatar">
						<span class="figure-label" data-i18n="demo.avatar">头像</span>
					</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.glow">Glow · 给 AI：安装并挂到指定区域</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="glow" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="glow">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="glow" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				aura.glow('#glow-card', { mode: 'dark', borderRadius: 22, borderWidth: 6, glowWidth: 140 })
				aura.glow('#glow-light', {
					mode: 'light',
					borderRadius: 22,
					borderWidth: 6,
					glowWidth: 120,
					skipGreeting: true,
				})
				aura.glow('#glow-pill', { mode: 'dark', borderRadius: 999, borderWidth: 5, glowWidth: 90, skipGreeting: true })
				aura.glow('#glow-avatar', { mode: 'dark', borderRadius: 999, borderWidth: 7, glowWidth: 110, skipGreeting: true })
			})
		</script>
	</body>
</html>
