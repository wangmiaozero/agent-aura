<!doctype html>
<html lang="en" data-i18n-page="home" data-i18n-title="page.thunder.title">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Thunder</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 42%, #191429 0%, #0c0a13 40%, #040407 75%, #010102 100%);
			}
			.figure {
				background: radial-gradient(circle, #302642, #110d18 72%);
				color: #e4dcff;
				border-color: rgba(180, 150, 255, 0.14);
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<select data-lang-select aria-label="Language">
					<option value="en">EN</option>
					<option value="zh">中文</option>
					<option value="ja">日本語</option>
					<option value="ko">한국어</option>
				</select>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.thunderTag">Tribulation · Lightning</div>
				<h1 data-i18n="home.thunderTitle">THUNDER AURA</h1>
				<p data-i18n="home.thunderDesc">
					雷霆沿轮廓高速游走并随机外放电弧，自动跟随 border-radius / clip-path。
				</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage" id="jie-shield-stage">
					<div class="figure is-shield" id="jie-shield" data-i18n="demo.glyph.tribulation">劫</div>
				</div>
				<div class="figure-stage" id="jie-hex-stage">
					<div class="figure is-hex" id="jie-hex" data-i18n="demo.glyph.bolt">雷</div>
				</div>
				<div class="figure-stage" id="jie-circle-stage">
					<div class="figure is-circle" id="jie-circle">
						<span class="figure-label" data-i18n="demo.overclock">超频</span>
					</div>
				</div>
				<div class="figure-stage" id="jie-pill-stage">
					<div class="figure is-pill" id="jie-pill">
						<span class="figure-label" data-i18n="demo.thinking">思考中</span>
					</div>
				</div>
				<div class="figure-stage" id="jie-card-stage">
					<div class="figure is-card" id="jie-card">
						<span class="figure-label" data-i18n="demo.executing">执行中</span>
					</div>
				</div>
				<div class="figure-stage" id="jie-diamond-stage">
					<div class="figure is-diamond" id="jie-diamond" data-i18n="demo.glyph.flash">闪</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.thunder">Thunder · 给 AI：安装并挂到指定元素</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="thunder" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="thunder">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="thunder" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				const light = { particleCount: 42, maxBranches: 8, skipGreeting: true }
				aura.thunder('#jie-shield', { container: '#jie-shield-stage', offset: 8, particleCount: 90, maxBranches: 16 })
				aura.thunder('#jie-hex', { container: '#jie-hex-stage', offset: 7, ...light })
				aura.thunder('#jie-circle', { container: '#jie-circle-stage', offset: 7, ...light })
				aura.thunder('#jie-pill', { container: '#jie-pill-stage', offset: 6, ...light })
				aura.thunder('#jie-card', { container: '#jie-card-stage', offset: 6, ...light })
				aura.thunder('#jie-diamond', { container: '#jie-diamond-stage', offset: 6, ...light })
			})
		</script>
	</body>
</html>
