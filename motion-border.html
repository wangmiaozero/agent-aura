<!doctype html>
<html lang="en" data-i18n-page="home" data-i18n-title="page.border.title">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Motion Border</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 45%, #18202b 0%, #0b0e14 45%, #050608 100%);
			}
			.figure {
				border-color: rgba(120, 210, 255, 0.18);
				background: linear-gradient(145deg, rgba(20, 23, 31, 0.96), rgba(9, 11, 16, 0.98));
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<select data-lang-select aria-label="Language">
					<option value="en">EN</option>
					<option value="zh">中文</option>
					<option value="ja">日本語</option>
					<option value="ko">한국어</option>
				</select>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.borderTag">Neural · Field</div>
				<h1 data-i18n="home.borderTitle">MOTION BORDER</h1>
				<p data-i18n="home.borderDesc">
					连续 Shader 光场沿圆角边框流动，光向外溢出。适合思考中、推理中、Agent 活跃态。
				</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage" id="border-card-stage">
					<div class="figure is-card" id="border-card">
						<span class="figure-label" data-i18n="demo.thinking">思考中</span>
					</div>
				</div>
				<div class="figure-stage" id="border-pill-stage">
					<div class="figure is-pill" id="border-pill">
						<span class="figure-label" data-i18n="demo.streaming">流式输出</span>
					</div>
				</div>
				<div class="figure-stage" id="border-circle-stage">
					<div class="figure is-circle" id="border-circle">
						<span class="figure-label" data-i18n="demo.avatar">头像</span>
					</div>
				</div>
				<div class="figure-stage" id="border-idle-stage">
					<div class="figure is-card" id="border-idle">
						<span class="figure-label" data-i18n="demo.idle">待命</span>
					</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.border">Border · 给 AI：安装并挂到指定区域</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="border" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="border">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="border" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				aura.border('#border-card', {
					container: '#border-card-stage',
					glowPadding: 48,
					glowWidth: 80,
					borderWidth: 2,
					borderRadius: 22,
				})
				aura.border('#border-pill', {
					container: '#border-pill-stage',
					glowPadding: 36,
					glowWidth: 64,
					borderWidth: 2,
					borderRadius: 999,
					skipGreeting: true,
				})
				aura.border('#border-circle', {
					container: '#border-circle-stage',
					glowPadding: 40,
					glowWidth: 72,
					borderWidth: 2,
					borderRadius: 999,
					skipGreeting: true,
				})
				aura.border('#border-idle', {
					container: '#border-idle-stage',
					glowPadding: 32,
					glowWidth: 48,
					borderWidth: 1.5,
					borderRadius: 18,
					speed: 0.45,
					skipGreeting: true,
				})
			})
		</script>
	</body>
</html>
