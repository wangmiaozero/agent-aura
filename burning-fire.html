<!doctype html>
<html lang="en" data-i18n-page="home">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent Aura · Burning Life</title>
		<link rel="stylesheet" href="./site.css" />
		<style>
			.figure-stage {
				background: radial-gradient(circle at 50% 45%, rgba(120, 18, 8, 0.28) 0%, rgba(20, 5, 5, 0.78) 38%, #030303 100%);
			}
			#burn-hero {
				width: min(760px, 100%);
				min-height: 420px;
				padding: 36px 36px 28px;
				border-radius: 28px;
				border: 1px solid rgba(255, 120, 30, 0.72);
				text-align: left;
				place-items: start;
				box-shadow:
					0 0 22px rgba(255, 60, 0, 0.45),
					0 0 90px rgba(255, 40, 0, 0.22);
			}
			#burn-hero h2 {
				margin: 18px 0 8px;
				font-size: clamp(40px, 7vw, 72px);
				line-height: 0.92;
				background: linear-gradient(180deg, #fff 0%, #ffd2ad 32%, #ff9d57 60%, #ff5f22 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			#burn-hero p {
				max-width: 560px;
			}
		</style>
	</head>
	<body>
		<nav class="nav">
			<a class="brand" href="./index.html">Agent Aura</a>
			<div class="links">
				<a href="./index.html" data-i18n="nav.demo">演示</a>
				<a href="./docs.html" data-i18n="nav.api">API</a>
				<button type="button" data-lang-toggle>中文</button>
			</div>
		</nav>
		<main class="demo-wrap">
			<header class="demo-head">
				<div class="tag" data-i18n="home.burnTag">Agent Overclock</div>
				<h1 data-i18n="home.burnTitle">AGENT BURNING</h1>
				<p data-i18n="home.burnDesc">更猛的火焰 + 烟雾 + 背景热浪，像 Agent 正在燃烧寿命硬扛推理。</p>
			</header>
			<div class="figure-grid">
				<div class="figure-stage figure-hero" id="burn-hero-stage">
					<div class="figure is-card" id="burn-hero">
						<div class="tag" data-i18n="home.burnTag">Agent Overclock</div>
						<h2 data-i18n="home.burnTitle">AGENT BURNING</h2>
						<p data-i18n="home.burnDesc">更猛的火焰 + 烟雾 + 背景热浪，像 Agent 正在燃烧寿命硬扛推理。</p>
					</div>
				</div>
				<div class="figure-stage" id="burn-circle-stage">
					<div class="figure is-circle" id="burn-circle">CORE</div>
				</div>
				<div class="figure-stage" id="burn-pill-stage">
					<div class="figure is-pill" id="burn-pill">
						<span class="figure-label" data-i18n="demo.overclock">超频</span>
					</div>
				</div>
				<div class="figure-stage" id="burn-card-stage">
					<div class="figure is-card" id="burn-card">
						<span class="figure-label" data-i18n="demo.danger">危险</span>
					</div>
				</div>
			</div>
			<p class="copy-hint" data-build-hint data-i18n="copy.hint">
				提示词可直接改选择器 / 区域 / 参数，再复制给 Cursor / Claude。
			</p>
			<div class="prompt-block">
				<div class="prompt-head">
					<strong data-i18n="copy.block.burning">Burning · 给 AI：安装并挂到指定区域</strong>
					<div class="prompt-actions">
						<button type="button" class="prompt-reset" data-reset-prompt="burning" data-i18n="copy.reset">重置</button>
						<button type="button" class="copy-prompt" data-copy-prompt="burning">
							<span data-copy-label data-i18n="copy.prompt">复制 AI 提示词</span>
						</button>
					</div>
				</div>
				<textarea data-prompt-preview="burning" spellcheck="false" rows="12"></textarea>
			</div>
		</main>
		<script type="module">
			import { bootDemo } from './demo-boot.js'
			bootDemo((aura) => {
				aura.burning('#burn-hero', { container: '#burn-hero-stage' })
				aura.burning('#burn-circle', {
					container: '#burn-circle-stage',
					particleCount: 700,
					smokeCount: 140,
					glow: false,
					skipGreeting: true,
				})
				aura.burning('#burn-pill', {
					container: '#burn-pill-stage',
					particleCount: 640,
					smokeCount: 120,
					glow: false,
					skipGreeting: true,
				})
				aura.burning('#burn-card', {
					container: '#burn-card-stage',
					particleCount: 720,
					smokeCount: 140,
					glow: false,
					skipGreeting: true,
				})
			})
		</script>
	</body>
</html>
